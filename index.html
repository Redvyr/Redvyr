<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redvyr</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #120804;
      color: #fff0c8;
      overflow: hidden;
    }

    .home {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image:
        linear-gradient(to bottom, rgba(0,0,0,0.05), rgba(0,0,0,0.35)),
        url("backround.png");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(0,0,0,0.28));
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 40px;
      align-items: center;
      width: min(1050px, 100%);
    }

    .left {
      max-width: 520px;
      background: rgba(25, 12, 5, 0.72);
      border: 2px solid rgba(242, 195, 95, 0.5);
      border-radius: 16px;
      padding: 26px;
      backdrop-filter: blur(4px);
      box-shadow: 0 12px 35px rgba(0,0,0,0.35);
    }

    .logo {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(50px, 7vw, 82px);
      line-height: 0.9;
      color: #ffe4a6;
      text-shadow: 4px 4px 0 #55130c;
      letter-spacing: 2px;
    }

    .logo span {
      display: block;
      color: #d33a2a;
    }

    .tagline {
      margin-top: 14px;
      color: #f2c35f;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 14px;
    }

    .desc {
      margin-top: 18px;
      color: rgba(255, 240, 200, 0.86);
      line-height: 1.6;
      font-size: 16px;
      font-weight: 700;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-weight: 900;
      transition: 0.15s;
    }

    .play {
      background: linear-gradient(#d9442e, #8e1c13);
      color: white;
      border: 2px solid #f2c35f;
      box-shadow: 0 5px 0 #3b0a05;
    }

    .info {
      background: rgba(0,0,0,0.45);
      color: #fff0c8;
      border: 2px solid rgba(242, 195, 95, 0.45);
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
    }

    .mascot-wrap {
      text-align: center;
    }

    .mascot {
      width: 300px;
      max-width: 100%;
      filter: drop-shadow(0 18px 18px rgba(0,0,0,0.55));
      animation: floaty 3.5s ease-in-out infinite;
    }

    @keyframes floaty {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .small-note {
      margin-top: 12px;
      display: inline-block;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(242, 195, 95, 0.45);
      border-radius: 999px;
      padding: 9px 14px;
      color: #ffe7b0;
      font-size: 13px;
      font-weight: 800;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(120px);
      background: #160b05;
      color: #fff0c8;
      border: 2px solid #f2c35f;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 900;
      transition: 0.25s;
      z-index: 10;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 800px) {
      body {
        overflow: auto;
      }

      .home {
        min-height: 100vh;
        height: auto;
      }

      .content {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .left {
        margin: 0 auto;
      }

      .buttons {
        justify-content: center;
      }

      .mascot {
        width: 230px;
      }
    }
  </style>
</head>

<body>
  <main class="home">
    <div class="overlay"></div>

    <section class="content">
      <div class="left">
        <h1 class="logo">REDVYR <span>KINGDOMS</span></h1>
        <div class="tagline">Build • Explore • Belong</div>

        <p class="desc">
          A cozy browser kingdom adventure. Build your camp, complete quests,
          collect gear, and grow your legend in the world of Redvyr.
        </p>

        <div class="buttons">
          <button class="play" onclick="showMessage('Gameplay coming soon.')">Play Preview</button>
          <button class="info" onclick="showMessage('Quests, kingdoms, accounts, and inventory are planned.')">What is this?</button>
        </div>
      </div>

      <div class="mascot-wrap">
        <img class="mascot" src="mascot.png" alt="Redvyr mascot">
        <div class="small-note">Preview site only</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast">Message</div>

  <script>
    function showMessage(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);
    }
  </script>
</body>
</html>
