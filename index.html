<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redvyr Kingdoms</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --red: #9f1f17;
      --red-light: #d9442e;
      --gold: #f2c35f;
      --cream: #fff0c8;
      --dark: #160b05;
      --panel: rgba(25, 12, 5, 0.76);
      --panel-dark: rgba(10, 5, 2, 0.74);
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #120804;
      color: var(--cream);
      overflow: hidden;
    }

    .screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image:
        linear-gradient(to bottom, rgba(0,0,0,0.04), rgba(0,0,0,0.42)),
        url("backround.png");
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.28)),
        linear-gradient(to right, rgba(0,0,0,0.28), transparent 28%, transparent 72%, rgba(0,0,0,0.28));
      pointer-events: none;
      z-index: 1;
    }

    .top-logo {
      position: absolute;
      top: 22px;
      left: 24px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 15px;
      background: rgba(18, 8, 3, 0.74);
      border: 2px solid rgba(242, 195, 95, 0.45);
      border-radius: 14px;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .crest {
      width: 38px;
      height: 44px;
      background: linear-gradient(#d9442e, #76150e);
      border: 2px solid var(--gold);
      border-radius: 6px 6px 12px 12px;
      display: grid;
      place-items: center;
      font-size: 21px;
    }

    .top-logo strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      line-height: 0.9;
      color: #ffe4a6;
      text-shadow: 2px 2px 0 #55130c;
    }

    .top-logo span {
      font-size: 10px;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 3px;
    }

    .center-area {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 26px;
    }

    .intro-layout {
      width: min(950px, 100%);
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 42px;
      align-items: center;
      transition: 0.45s ease;
    }

    .intro-layout.hide {
      opacity: 0;
      transform: translateY(-18px) scale(0.98);
      pointer-events: none;
    }

    .intro-panel {
      background: var(--panel);
      border: 2px solid rgba(242, 195, 95, 0.5);
      border-radius: 18px;
      padding: 28px;
      backdrop-filter: blur(4px);
      box-shadow: 0 14px 38px rgba(0,0,0,0.35);
    }

    .title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(54px, 7vw, 90px);
      line-height: 0.88;
      color: #ffe4a6;
      text-shadow: 4px 4px 0 #55130c;
      letter-spacing: 2px;
    }

    .title span {
      display: block;
      color: var(--red-light);
    }

    .tagline {
      margin-top: 14px;
      color: var(--gold);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 14px;
    }

    .desc {
      margin-top: 18px;
      color: rgba(255, 240, 200, 0.88);
      line-height: 1.6;
      font-size: 16px;
      font-weight: 700;
    }

    .login-box {
      margin-top: 22px;
      display: grid;
      gap: 10px;
    }

    label {
      color: var(--gold);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      border-radius: 11px;
      border: 2px solid rgba(242, 195, 95, 0.45);
      background: rgba(0,0,0,0.45);
      color: var(--cream);
      font-weight: 900;
      outline: none;
    }

    .play-btn {
      cursor: pointer;
      margin-top: 8px;
      border-radius: 12px;
      padding: 15px 24px;
      background: linear-gradient(#d9442e, #8e1c13);
      color: white;
      border: 2px solid var(--gold);
      box-shadow: 0 5px 0 #3b0a05;
      font-weight: 900;
      font-size: 16px;
      transition: 0.15s;
    }

    .play-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
    }

    .mascot-preview {
      display: grid;
      place-items: center;
      text-align: center;
    }

    .mascot {
      width: min(300px, 90%);
      max-height: 56vh;
      object-fit: contain;
      filter: drop-shadow(0 18px 18px rgba(0,0,0,0.55));
      animation: floaty 3.5s ease-in-out infinite;
    }

    @keyframes floaty {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .preview-pill {
      margin-top: 12px;
      display: inline-block;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(242, 195, 95, 0.45);
      border-radius: 999px;
      padding: 9px 14px;
      color: #ffe7b0;
      font-size: 13px;
      font-weight: 800;
    }

    .game-menu {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: none;
      padding: 22px;
    }

    .game-menu.show {
      display: block;
      animation: fadeIn 0.45s ease forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.98);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .profile-bar {
      position: absolute;
      top: 22px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(18, 8, 3, 0.76);
      border: 2px solid rgba(242, 195, 95, 0.45);
      border-radius: 14px;
      padding: 11px 14px;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(#d9442e, #76150e);
      border: 2px solid var(--gold);
      font-size: 22px;
    }

    .profile-bar strong {
      display: block;
      color: #ffe4a6;
      font-size: 15px;
    }

    .profile-bar span {
      display: block;
      margin-top: 2px;
      color: rgba(255,240,200,0.72);
      font-size: 12px;
      font-weight: 800;
    }

    .world-select {
      position: absolute;
      top: 98px;
      right: 24px;
      width: 260px;
      background: rgba(18, 8, 3, 0.76);
      border: 2px solid rgba(242, 195, 95, 0.45);
      border-radius: 14px;
      padding: 14px;
      backdrop-filter: blur(4px);
    }

    .player-stage {
      position: absolute;
      left: 50%;
      bottom: 110px;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      text-align: center;
    }

    .name-tag {
      margin-bottom: 8px;
      padding: 8px 14px;
      background: rgba(18, 8, 3, 0.78);
      border: 2px solid rgba(242, 195, 95, 0.55);
      border-radius: 999px;
      color: #ffe4a6;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(0,0,0,0.35);
      animation: floaty 3.5s ease-in-out infinite;
    }

    .game-mascot {
      width: min(270px, 36vw);
      max-height: 48vh;
      object-fit: contain;
      filter: drop-shadow(0 18px 18px rgba(0,0,0,0.55));
      animation: floaty 3.5s ease-in-out infinite;
    }

    .menu-buttons {
      position: absolute;
      left: 24px;
      bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      width: min(660px, calc(100vw - 48px));
    }

    .menu-button {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 15px;
      min-width: 145px;
      border-radius: 13px;
      color: var(--cream);
      background: rgba(18, 8, 3, 0.76);
      border: 2px solid rgba(242, 195, 95, 0.45);
      backdrop-filter: blur(4px);
      box-shadow: 0 6px 0 rgba(0,0,0,0.24);
      transition: 0.15s;
      font-weight: 900;
    }

    .menu-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.14);
    }

    .menu-button .icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.34);
      border: 1px solid rgba(242, 195, 95, 0.32);
      font-size: 18px;
    }

    .right-actions {
      position: absolute;
      right: 24px;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 210px;
    }

    .side-button {
      cursor: pointer;
      padding: 12px 14px;
      border-radius: 13px;
      color: var(--cream);
      background: rgba(18, 8, 3, 0.76);
      border: 2px solid rgba(242, 195, 95, 0.45);
      backdrop-filter: blur(4px);
      box-shadow: 0 6px 0 rgba(0,0,0,0.24);
      transition: 0.15s;
      font-weight: 900;
      text-align: left;
    }

    .side-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.14);
    }

    .mail-button {
      position: relative;
    }

    .mail-dot {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e5392b;
      border: 2px solid white;
      box-shadow: 0 0 10px rgba(229,57,43,0.8);
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-bg.show {
      display: flex;
    }

    .modal {
      width: min(460px, 100%);
      background: #1d0d05;
      border: 3px solid var(--gold);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 70px rgba(0,0,0,0.6);
    }

    .modal h2 {
      color: var(--gold);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .modal p {
      color: rgba(255,240,200,0.84);
      line-height: 1.55;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .modal button {
      cursor: pointer;
      padding: 11px 16px;
      border-radius: 10px;
      background: linear-gradient(#d9442e, #8e1c13);
      color: white;
      border: 2px solid var(--gold);
      font-weight: 900;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(120px);
      background: #160b05;
      color: var(--cream);
      border: 2px solid var(--gold);
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 900;
      transition: 0.25s;
      z-index: 40;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 850px) {
      body {
        overflow: auto;
      }

      .screen {
        height: auto;
        min-height: 100vh;
      }

      .intro-layout {
        grid-template-columns: 1fr;
        text-align: center;
        padding-top: 90px;
      }

      .intro-panel {
        margin: 0 auto;
      }

      .game-menu.show {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding-top: 100px;
      }

      .profile-bar,
      .world-select,
      .player-stage,
      .menu-buttons,
      .right-actions {
        position: relative;
        left: auto;
        right: auto;
        top: auto;
        bottom: auto;
        transform: none;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
      }

      .player-stage {
        order: 1;
      }

      .world-select {
        order: 2;
      }

      .menu-buttons {
        order: 3;
        justify-content: center;
      }

      .right-actions {
        order: 4;
      }

      .profile-bar {
        order: 0;
      }

      .game-mascot {
        width: 220px;
        max-height: none;
      }
    }
  </style>
</head>

<body>
  <main class="screen">
    <div class="top-logo">
      <div class="crest">♕</div>
      <div>
        <strong>REDVYR</strong>
        <span>KINGDOMS</span>
      </div>
    </div>

    <!-- PHASE 1: START / LOGIN SCREEN -->
    <section id="introLayout" class="center-area">
      <div class="intro-layout">
        <div class="intro-panel">
          <h1 class="title">REDVYR <span>KINGDOMS</span></h1>
          <div class="tagline">Build • Explore • Belong</div>

          <p class="desc">
            Enter the Kingdom of Redvyr. Type your nickname, choose a preview world,
            and step into the first version of the game menu.
          </p>

          <div class="login-box">
            <label for="playerName">Nickname</label>
            <input id="playerName" placeholder="Guest Hero" maxlength="18" />

            <label for="startWorld">World</label>
            <select id="startWorld">
              <option>World A - Main Realm</option>
              <option>World B - Forest Realm</option>
              <option>World C - Kingdom Test</option>
            </select>

            <button class="play-btn" onclick="startPreview()">Play Preview</button>
          </div>
        </div>

        <div class="mascot-preview">
          <img class="mascot" src="mascot.png" alt="Redvyr mascot">
          <div class="preview-pill">Preview build · no gameplay yet</div>
        </div>
      </div>
    </section>

    <!-- PHASE 2: AFTER PLAYER STARTS PREVIEW -->
    <section id="gameMenu" class="game-menu">
      <div class="profile-bar">
        <div class="avatar">🧑</div>
        <div>
          <strong id="profileName">Guest Hero</strong>
          <span>Level 1 · 250 coins · 15 gems</span>
        </div>
      </div>

      <div class="world-select">
        <label for="menuWorld">World Select</label>
        <select id="menuWorld" onchange="worldChanged()">
          <option>World A - Main Realm</option>
          <option>World B - Forest Realm</option>
          <option>World C - Kingdom Test</option>
        </select>
      </div>

      <div class="player-stage">
        <div id="nameTag" class="name-tag">Guest Hero</div>
        <img class="game-mascot" src="mascot.png" alt="Your Redvyr character">
      </div>

      <div class="menu-buttons">
        <button class="menu-button" onclick="openModal('Quests')">
          <span class="icon">📜</span>
          Quests
        </button>

        <button class="menu-button" onclick="openModal('Shop')">
          <span class="icon">💰</span>
          Shop
        </button>

        <button class="menu-button" onclick="openModal('Kingdoms')">
          <span class="icon">🏰</span>
          Kingdoms
        </button>

        <button class="menu-button mail-button" onclick="openMail()">
          <span class="icon">✉️</span>
          Mail
          <span id="mailDot" class="mail-dot"></span>
        </button>
      </div>

      <div class="right-actions">
        <button class="side-button" onclick="openModal('Settings')">⚙ Settings</button>
        <button class="side-button" onclick="goBack()">↩ Change Name</button>
      </div>
    </section>
  </main>

  <div id="modalBg" class="modal-bg" onclick="closeModal(event)">
    <div class="modal">
      <h2 id="modalTitle">Title</h2>
      <p id="modalText">Text</p>
      <button onclick="hideModal()">Close</button>
    </div>
  </div>

  <div id="toast" class="toast">Message</div>

  <script>
    const playerName = document.getElementById("playerName");
    const startWorld = document.getElementById("startWorld");
    const menuWorld = document.getElementById("menuWorld");
    const introLayout = document.getElementById("introLayout");
    const gameMenu = document.getElementById("gameMenu");
    const profileName = document.getElementById("profileName");
    const nameTag = document.getElementById("nameTag");
    const mailDot = document.getElementById("mailDot");

    const modalInfo = {
      "Quests": "Quests will appear here later. For now, this is a preview menu. Planned quests: collect resources, defeat enemies, discover places, and claim daily rewards.",
      "Shop": "The shop will sell cosmetics, skins, boosts, and simple starter items later. The plan is to keep it fair and not make it heavily pay-to-win.",
      "Kingdoms": "Kingdoms will let players join groups, build together, donate resources, and climb seasonal leaderboards.",
      "Settings": "Settings will include sound, graphics, account options, and display options later.",
      "Mail": "Welcome back! You received 5 gems. Mail rewards will reset daily once accounts are added."
    };

    window.addEventListener("load", () => {
      const savedName = localStorage.getItem("redvyrName");
      const savedWorld = localStorage.getItem("redvyrWorld");

      if (savedName) {
        playerName.value = savedName;
      }

      if (savedWorld) {
        startWorld.value = savedWorld;
        menuWorld.value = savedWorld;
      }
    });

    function startPreview() {
      const name = playerName.value.trim() || "Guest Hero";
      const world = startWorld.value;

      localStorage.setItem("redvyrName", name);
      localStorage.setItem("redvyrWorld", world);

      profileName.textContent = name;
      nameTag.textContent = name;
      menuWorld.value = world;

      introLayout.querySelector(".intro-layout").classList.add("hide");

      setTimeout(() => {
        introLayout.style.display = "none";
        gameMenu.classList.add("show");
        showToast("Welcome to " + world + ", " + name + ".");
      }, 420);
    }

    function goBack() {
      gameMenu.classList.remove("show");
      introLayout.style.display = "grid";

      setTimeout(() => {
        introLayout.querySelector(".intro-layout").classList.remove("hide");
      }, 50);
    }

    function worldChanged() {
      const world = menuWorld.value;
      localStorage.setItem("redvyrWorld", world);
      showToast("Selected " + world + ". Worlds are preview-only right now.");
    }

    function openMail() {
      mailDot.style.display = "none";
      openModal("Mail");
    }

    function openModal(title) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalText").textContent = modalInfo[title] || "This feature is coming soon.";
      document.getElementById("modalBg").classList.add("show");
    }

    function hideModal() {
      document.getElementById("modalBg").classList.remove("show");
    }

    function closeModal(event) {
      if (event.target.id === "modalBg") {
        hideModal();
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }
  </script>
</body>
</html>
